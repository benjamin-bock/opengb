name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-ARM
            os: macos-14
            artifact: opengb-macos-arm64
            bindir: build/bin
            ext: ''
            pack: tar
          - name: Windows
            os: windows-latest
            artifact: opengb-windows-x64
            bindir: build/bin
            ext: .exe
            pack: zip
          - name: Linux
            os: ubuntu-22.04
            artifact: opengb-linux-x64
            bindir: build/bin
            ext: ''
            pack: tar

    env:
      VCPKG_ROOT: ${{ runner.temp }}\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_ttf

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" install "sdl2:x64-windows" "sdl2-ttf:x64-windows"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix sdl2)/lib/pkgconfig:$(brew --prefix sdl2_ttf)/lib/pkgconfig:$PKG_CONFIG_PATH"
          make clean && make -j4

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make clean && make -j"$(nproc)"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "$env:VCPKG_ROOT\installed\x64-windows"
          $env:PATH = "$prefix\bin;$env:PATH"
          $sdl2Cflags = "-I$prefix\include\SDL2 -I$prefix\include -DSDL_MAIN_HANDLED"
          $sdl2Libs = "-L$prefix\lib -static-libgcc -static-libstdc++ -lSDL2 -lSDL2_ttf"
          make clean
          make -j 4 "SDL2_CFLAGS=$sdl2Cflags" "SDL2_LIBS=$sdl2Libs"
          # Fail early if the exe still depends on missing runtime DLLs
          $mingwBin = (Get-Command g++).Source | Split-Path
          & "$mingwBin\objdump.exe" -p build/bin/opengb.exe | Select-String "DLL Name"

      - name: Package (tar)
        if: matrix.pack == 'tar'
        run: |
          mkdir -p dist
          cp ${{ matrix.bindir }}/opengb${{ matrix.ext }} dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist opengb${{ matrix.ext }} README.md LICENSE 2>/dev/null || tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist opengb${{ matrix.ext }}
          ls -la dist

      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.bindir }}/opengb${{ matrix.ext }}" dist/
          # Bundle every runtime DLL the exe and SDL depend on
          $mingwBin = (Get-Command g++).Source | Split-Path
          $needed = & "$mingwBin\objdump.exe" -p "${{ matrix.bindir }}/opengb.exe" | Select-String 'DLL Name: (.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $searchDirs = @("$env:VCPKG_ROOT\installed\x64-windows\bin", $mingwBin)
          foreach ($dll in $needed) {
            if ($dll -in @('kernel32.dll','user32.dll','gdi32.dll','winmm.dll','ole32.dll','oleaut32.dll','imm32.dll','advapi32.dll','shell32.dll','version.dll','setupapi.dll','ws2_32.dll','dbghelp.dll','bcrypt.dll','ntdll.dll','comctl32.dll','shlwapi.dll','dinput8.dll','xinput1_4.dll','hid.dll','powrprof.dll','secur32.dll')) { continue }
            foreach ($dir in $searchDirs) {
              $src = Join-Path $dir $dll
              if (Test-Path $src) { Copy-Item $src dist/; break }
            }
          }
          # Resolve second-level dependencies of the bundled DLLs
          $bundled = Get-ChildItem dist/*.dll
          foreach ($b in $bundled) {
            $depNames = & "$mingwBin\objdump.exe" -p $b.FullName | Select-String 'DLL Name: (.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($dll in $depNames) {
              if ((Test-Path "dist/$dll") -or ($dll -in @('kernel32.dll','user32.dll','gdi32.dll','winmm.dll','ole32.dll','oleaut32.dll','imm32.dll','advapi32.dll','shell32.dll','version.dll','setupapi.dll','ws2_32.dll','dbghelp.dll','bcrypt.dll','ntdll.dll','comctl32.dll','shlwapi.dll','dinput8.dll','xinput1_4.dll','hid.dll','powrprof.dll','secur32.dll'))) { continue }
              foreach ($dir in $searchDirs) {
                $src = Join-Path $dir $dll
                if (Test-Path $src) { Copy-Item $src dist/; break }
              }
            }
          }
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath dist/${{ matrix.artifact }}.zip -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
