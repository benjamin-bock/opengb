name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-ARM
            os: macos-14
            artifact: opengb-macos-arm64
            bindir: build/bin
            ext: ''
            pack: tar
          - name: Windows
            os: windows-latest
            artifact: opengb-windows-x64
            bindir: build/bin
            ext: .exe
            pack: zip
          - name: Linux
            os: ubuntu-22.04
            artifact: opengb-linux-x64
            bindir: build/bin
            ext: ''
            pack: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_ttf

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev pkg-config

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_ROOT\vcpkg.exe" install "sdl2:x64-windows" "sdl2-ttf:x64-windows"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix sdl2)/lib/pkgconfig:$(brew --prefix sdl2_ttf)/lib/pkgconfig:$PKG_CONFIG_PATH"
          make clean && make -j4

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          make clean && make -j"$(nproc)"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: |
          $prefix = "$env:VCPKG_ROOT\installed\x64-windows"
          $env:PATH = "$prefix\bin;$env:PATH"
          $sdl2Cflags = "-I$prefix\include\SDL2 -I$prefix\include"
          $sdl2Libs = "-L$prefix\lib -lSDL2 -lSDL2_ttf"
          make clean
          make -j 4 "SDL2_CFLAGS=$sdl2Cflags" "SDL2_LIBS=$sdl2Libs"

      - name: Package (tar)
        if: matrix.pack == 'tar'
        run: |
          mkdir -p dist
          cp ${{ matrix.bindir }}/opengb${{ matrix.ext }} dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist opengb${{ matrix.ext }} README.md LICENSE 2>/dev/null || tar -czf dist/${{ matrix.artifact }}.tar.gz -C dist opengb${{ matrix.ext }}
          ls -la dist

      - name: Package (zip)
        if: matrix.pack == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.bindir }}/opengb${{ matrix.ext }}" dist/
          $sdlDlls = Get-ChildItem "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue
          if ($sdlDlls) { Copy-Item $sdlDlls dist/ }
          Copy-Item README.md dist/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath dist/${{ matrix.artifact }}.zip -Force
          Get-ChildItem dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
